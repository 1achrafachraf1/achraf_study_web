<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الدروس والتعليم</title>
    <!-- CSS link -->
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome للايقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Header / Navbar -->
    <header class="navbar">
        <div class="container nav-container">
            <div class="logo">
                <i class="fa-solid fa-graduation-cap"></i>
                <span>منصتي الدراسية</span>
            </div>
            <div class="nav-actions">
                <button id="adminBtn" class="btn btn-outline">
                    <i class="fa-solid fa-lock"></i> <span id="adminBtnText">دخول الآدمن</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container main-content">
        <!-- Subject Selection Tabs -->
        <div class="tabs-container">
            <button class="tab-btn active" data-subject="math">
                <span class="tab-icon">📐</span> الرياضيات
            </button>
            <button class="tab-btn" data-subject="physics">
                <span class="tab-icon">🧪</span> الفيزياء والكيمياء
            </button>
            <button class="tab-btn" data-subject="svt">
                <span class="tab-icon">🧬</span> علوم الحياة والأرض
            </button>
        </div>

        <!-- Admin Management Section (Hidden by default) -->
        <section id="adminSection" class="admin-section hidden">
            <div class="admin-card">
                <div class="admin-header">
                    <h2><i class="fa-solid fa-pen-to-square"></i> لوحة إدارة الدروس</h2>
                    <span class="badge">وضع الآدمن</span>
                </div>
                <form id="courseForm" class="course-form">
                    <input type="hidden" id="courseId">
                    <div class="form-group">
                        <label for="courseSubject">المادة</label>
                        <select id="courseSubject" required>
                            <option value="math">الرياضيات</option>
                            <option value="physics">الفيزياء والكيمياء</option>
                            <option value="svt">علوم الحياة والأرض</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="courseTitle">عنوان الدرس</label>
                        <input type="text" id="courseTitle" placeholder="مثال: درس الاتصال والنهايات" required>
                    </div>
                    <div class="form-group">
                        <label for="courseUrl">رابط فيديو اليوتيوب</label>
                        <input type="url" id="courseUrl" placeholder="https://www.youtube.com/watch?v=..." required>
                    </div>
                    <div class="form-actions">
                        <button type="submit" id="saveCourseBtn" class="btn btn-primary">
                            <i class="fa-solid fa-plus"></i> إضافة الدرس
                        </button>
                        <button type="button" id="cancelEditBtn" class="btn btn-secondary hidden">إلغاء التعديل</button>
                    </div>
                </form>
            </div>
        </section>

        <!-- Courses Display Section -->
        <section class="courses-section">
            <div class="section-title">
                <h2 id="currentSubjectTitle">دروس الرياضيات</h2>
                <span id="coursesCount" class="count-badge">0 دروس</span>
            </div>

            <div id="coursesGrid" class="courses-grid">
                <!-- Data will be loaded dynamically via script.js -->
            </div>

            <!-- Empty State Message -->
            <div id="emptyState" class="empty-state hidden">
                <i class="fa-solid fa-folder-open"></i>
                <p>لا توجد دروس مضافة حالياً في هذه المادة.</p>
            </div>
        </section>
    </main>

    <!-- Video Modal (لمشاهدة الفيديو) -->
    <div id="videoModal" class="modal hidden">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <button class="close-modal" id="closeModal">&times;</button>
            <div class="iframe-container">
                <iframe id="youtubeIframe" src="" frameborder="0" allowfullscreen></iframe>
            </div>
            <h3 id="modalVideoTitle"></h3>
        </div>
    </div>

    <!-- Password Auth Modal (لمنع الوصول غير المصرح للآدمن) -->
    <div id="authModal" class="modal hidden">
        <div class="modal-overlay"></div>
        <div class="modal-card">
            <h3><i class="fa-solid fa-shield-halved"></i> تسجيل دخول الآدمن</h3>
            <p>أدخل كلمة المرور للوصول إلى صلاحيات التعديل:</p>
            <input type="password" id="adminPasswordInput" placeholder="كلمة المرور...">
            <div class="modal-actions">
                <button id="loginBtn" class="btn btn-primary">تأكيد</button>
                <button id="closeAuthModal" class="btn btn-secondary">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK (Version 9 Compatibility) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <!-- JavaScript Files -->
    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
