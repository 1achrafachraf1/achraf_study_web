<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الدروس والفروض المنزلية</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header class="navbar">
        <div class="container nav-container">
            <div class="logo">
                <i class="fa-solid fa-graduation-cap"></i>
                <span>منصتي الدراسية</span>
            </div>
            <div class="nav-actions">
                <button id="calcToggleBtn" class="btn btn-outline" title="حاسبة علمية"><i class="fa-solid fa-calculator"></i></button>
                <button id="aiToggleBtn" class="btn btn-outline" title="المساعد الذكي"><i class="fa-solid fa-robot"></i></button>
                <button id="adminBtn" class="btn btn-outline">
                    <i class="fa-solid fa-lock"></i> <span id="adminBtnText">دخول الآدمن</span>
                </button>
            </div>
        </div>
    </header>

    <main class="container main-content">
        <!-- Main Navigation Tabs -->
        <div class="main-tabs">
            <button class="main-tab-btn active" data-tab="courses"><i class="fa-solid fa-book-open"></i> الدروس والفيديوهات</button>
            <button class="main-tab-btn" data-tab="homework"><i class="fa-solid fa-file-pdf"></i> الفروض المنزلية (PDF)</button>
            <button class="main-tab-btn" data-tab="favorites"><i class="fa-solid fa-heart"></i> المفضلة (<span id="favCount">0</span>)</button>
        </div>

        <!-- Subject Selection -->
        <div class="tabs-container" id="subjectsBar">
            <button class="tab-btn active" data-subject="math"><span class="tab-icon">📐</span> الرياضيات</button>
            <button class="tab-btn" data-subject="physics"><span class="tab-icon">🧪</span> الفيزياء والكيمياء</button>
            <button class="tab-btn" data-subject="svt"><span class="tab-icon">🧬</span> علوم الحياة والأرض</button>
        </div>

        <!-- Search Bar -->
        <div class="search-container">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" id="searchInput" placeholder="ابحث عن درس أو فرض بالاسم...">
        </div>

        <!-- Admin Form -->
        <section id="adminSection" class="admin-section hidden">
            <div class="admin-card">
                <div class="admin-header">
                    <h2><i class="fa-solid fa-pen-to-square"></i> لوحة إضافة وإدارة المحتوى</h2>
                    <span class="badge">وضع الآدمن</span>
                </div>
                
                <div class="admin-type-selector">
                    <label><input type="radio" name="contentType" value="course" checked> درس فيديو</label>
                    <label><input type="radio" name="contentType" value="homework"> فرض منزلي (PDF)</label>
                </div>

                <!-- Course Form -->
                <form id="courseForm" class="course-form">
                    <div class="form-group">
                        <label for="courseSubject">المادة</label>
                        <select id="courseSubject" required>
                            <option value="math">الرياضيات</option>
                            <option value="physics">الفيزياء والكيمياء</option>
                            <option value="svt">علوم الحياة والأرض</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="courseTitle">عنوان الدرس</label>
                        <input type="text" id="courseTitle" placeholder="عنوان الدرس..." required>
                    </div>
                    <div class="form-group">
                        <label for="courseUrl">رابط فيديو اليوتيوب</label>
                        <input type="url" id="courseUrl" placeholder="https://www.youtube.com/watch?v=..." required>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary"><i class="fa-solid fa-plus"></i> إضافة الدرس</button>
                    </div>
                </form>

                <!-- Homework Form -->
                <form id="homeworkForm" class="course-form hidden">
                    <div class="form-group">
                        <label for="hwSubject">المادة</label>
                        <select id="hwSubject" required>
                            <option value="math">الرياضيات</option>
                            <option value="physics">الفيزياء والكيمياء</option>
                            <option value="svt">علوم الحياة والأرض</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="hwTitle">عنوان الفرض المنزلي</label>
                        <input type="text" id="hwTitle" placeholder="مثال: الفرض المنزلي رقم 1 - النموذج أ" required>
                    </div>
                    <div class="form-group">
                        <label for="hwPdfUrl">رابط ملف الـ PDF</label>
                        <input type="url" id="hwPdfUrl" placeholder="https://example.com/file.pdf" required>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary"><i class="fa-solid fa-file-upload"></i> نشر الفرض</button>
                    </div>
                </form>
            </div>
        </section>

        <!-- Content Display -->
        <section class="courses-section">
            <div class="section-title">
                <h2 id="currentSectionTitle">دروس الرياضيات</h2>
                <span id="itemsCount" class="count-badge">0 عناصر</span>
            </div>

            <div id="coursesGrid" class="courses-grid"></div>

            <div id="emptyState" class="empty-state hidden">
                <i class="fa-solid fa-folder-open"></i>
                <p>لا توجد بيانات متاحة حالياً.</p>
            </div>
        </section>
    </main>

    <!-- Modals -->
    <div id="videoModal" class="modal hidden">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <button class="close-modal" id="closeModal">&times;</button>
            <div class="iframe-container">
                <iframe id="youtubeIframe" src="" frameborder="0" allowfullscreen></iframe>
            </div>
            <h3 id="modalVideoTitle"></h3>
        </div>
    </div>

    <div id="authModal" class="modal hidden">
        <div class="modal-overlay"></div>
        <div class="modal-card">
            <h3><i class="fa-solid fa-shield-halved"></i> تسجيل دخول الآدمن</h3>
            <p>أدخل كلمة المرور للوصول إلى صلاحيات الإدارة:</p>
            <input type="password" id="adminPasswordInput" placeholder="كلمة المرور...">
            <div class="modal-actions">
                <button id="loginBtn" class="btn btn-primary">تأكيد</button>
                <button id="closeAuthModal" class="btn btn-secondary">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- AI Assistant Widget (Gemini) -->
    <div id="aiWidget" class="ai-widget hidden">
        <div class="ai-header">
            <span><i class="fa-solid fa-robot"></i> مساعد Gemini الذكي</span>
            <button id="closeAiBtn">&times;</button>
        </div>
        <div class="ai-messages" id="aiMessages">
            <div class="ai-msg bot">مرحباً بك! 👋 أنا مساعدك الدراسي المدعوم بالذكاء الاصطناعي Gemini. اطرح علي أي سؤال فالدراسة!</div>
        </div>
        <div class="ai-input-area">
            <input type="text" id="aiInput" placeholder="اسأل الذكاء الاصطناعي شيئاً...">
            <button id="sendAiBtn"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <!-- Scientific Calculator Widget -->
    <div id="calcWidget" class="calc-widget hidden">
        <div class="calc-header">
            <span><i class="fa-solid fa-calculator"></i> حاسبة علمية</span>
            <button id="closeCalcBtn">&times;</button>
        </div>
        <input type="text" id="calcDisplay" readonly value="0">
        <div class="calc-buttons">
            <button class="calc-btn danger" onclick="calcClear()">C</button>
            <button class="calc-btn" onclick="calcOp('(')">(</button>
            <button class="calc-btn" onclick="calcOp(')')">)</button>
            <button class="calc-btn op" onclick="calcOp('/')">÷</button>

            <button class="calc-btn" onclick="calcNum('7')">7</button>
            <button class="calc-btn" onclick="calcNum('8')">8</button>
            <button class="calc-btn" onclick="calcNum('9')">9</button>
            <button class="calc-btn op" onclick="calcOp('*')">×</button>

            <button class="calc-btn" onclick="calcNum('4')">4</button>
            <button class="calc-btn" onclick="calcNum('5')">5</button>
            <button class="calc-btn" onclick="calcNum('6')">6</button>
            <button class="calc-btn op" onclick="calcOp('-')">-</button>

            <button class="calc-btn" onclick="calcNum('1')">1</button>
            <button class="calc-btn" onclick="calcNum('2')">2</button>
            <button class="calc-btn" onclick="calcNum('3')">3</button>
            <button class="calc-btn op" onclick="calcOp('+')">+</button>

            <button class="calc-btn" onclick="calcNum('0')">0</button>
            <button class="calc-btn" onclick="calcNum('.')">.</button>
            <button class="calc-btn op" onclick="calcFunc('sqrt')">√</button>
            <button class="calc-btn primary" onclick="calcEqual()">=</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
